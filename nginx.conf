server {
    listen 80;
    root /usr/share/nginx/html;

    # cBioPortal caches the dependency promise per tab config for the lifetime
    # of the page, but the browser will happily serve a stale bundle across
    # reloads. During a demo that reads as "my change did nothing".
    add_header Cache-Control "no-store" always;

    # Not needed for <script src>/<link href>, which are not CORS-gated. Present
    # so source maps resolve when the bundle is served cross-origin.
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri =404;
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
